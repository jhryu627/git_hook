repos:
  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: mypy
        name: mypy with poetry
        entry: poetry run mypy
        args: [ --config-file=pyproject.toml, --exclude=__init__.py ]
        language: system
        types: [ python ]
        stages: [ pre-commit ]

      - id: run-pytest-before-push
        name: Run Pytest before Push
        entry: poetry run pytest
        language: system
        types: [ python ]
        stages: [ pre-push ]




